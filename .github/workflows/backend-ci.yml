name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore backend dependencies
        run: dotnet restore backend/Soundwaves.Api/Soundwaves.Api.csproj

      - name: Build backend
        run: dotnet build backend/Soundwaves.Api/Soundwaves.Api.csproj --configuration Release --no-restore