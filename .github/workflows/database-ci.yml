name: Database Schema Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "backend-database/**"
        - ".github/workflows/database-ci.yml" 

jobs:
  validate-database:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend-database

    steps:
    - name: Set build version
        run: |
          short_sha="${GITHUB_SHA::7}"
          build_id="build-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}-${short_sha}"
          echo "BUILD_ID=$build_id" >> "$GITHUB_ENV"
          echo "Build ID: $build_id"
          echo "Build commit: $GITHUB_SHA"
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create database environment file
        run: cp .env.example .env

      - name: Start database
        run: docker compose up -d

      - name: Wait for MySQL
        run: docker compose exec -T db sh -s < database/scripts/wait-for-db.sh

      - name: Validate database schema
        run: |
          count=$(docker compose exec -T db sh -c \
            'mysql -N -s -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" "$MYSQL_DATABASE"' \
            < database/scripts/validate_schema.sql | tail -n 1)

          echo "Required tables found: $count"

          if [ "$count" -lt 9 ]; then
            echo "Database validation failed: expected 9 required tables."
            exit 1
          fi

          echo "Database validation passed."

      - name: Load development seed data
        run: |
          docker compose exec -T db sh -c \
            'mysql -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" "$MYSQL_DATABASE"' \
            < database/seeds/001_dev_seed.sql

      - name: Validate development seed data
        run: |
          results=$(docker compose exec -T db sh -c \
            'mysql -N -s -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" "$MYSQL_DATABASE"' \
            < database/scripts/validate_seed_data.sql)

          echo "$results"

          if echo "$results" | grep -q '^0$'; then
            echo "Seed data validation failed: one or more expected records were not found."
            exit 1
          fi

          echo "Seed data validation passed."
