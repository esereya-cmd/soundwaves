
name: Soundwave Database CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "backend-database/**"
      - ".github/workflows/database-schema-ci.yml"

jobs:
  database-validation:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend-database

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create test database environment
        run: |
          cat > .env <<'EOF'
          MYSQL_ROOT_PASSWORD=ci_root_password
          MYSQL_DATABASE=soundwave
          MYSQL_USER=soundwave
          MYSQL_PASSWORD=ci_test_password
          MYSQL_PORT=3306
          ADMINER_PORT=8080
          EOF

       - name: Start Soundwave database
        run: docker compose up -d --wait db



      - name: Show database tables
        run: |
          docker compose exec -T db sh -c \
            'MYSQL_PWD="$MYSQL_PASSWORD" mysql -u"$MYSQL_USER" "$MYSQL_DATABASE" -e "SHOW TABLES;"'

      - name: Validate required tables
        run: |
          for table in artists albums tracks; do
            docker compose exec -T db sh -c \
              "MYSQL_PWD=\"\$MYSQL_PASSWORD\" mysql -N -s -u\"\$MYSQL_USER\" \"\$MYSQL_DATABASE\" -e \"SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = DATABASE() AND table_name = '$table';\"")

            if [ "$count" != "1" ]; then
              echo "ERROR: Required table $table is missing"
              exit 1
            fi

            echo "PASS: $table exists"
          done

      - name: Validate seed data
        run: |
          docker compose exec -T db sh -c \
            'MYSQL_PWD="$MYSQL_PASSWORD" mysql -u"$MYSQL_USER" "$MYSQL_DATABASE"' \
            < database/scripts/validate_seed_data.sql

          echo "Database seed validation completed"

      - name: Show database logs on failure
        if: failure()
        run: docker compose logs db

      - name: Stop database
        if: always()
        run: docker compose down -v
